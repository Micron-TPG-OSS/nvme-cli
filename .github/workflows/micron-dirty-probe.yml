---
# SPDX-License-Identifier: GPL-2.0-or-later
#
# THROWAWAY DIAGNOSTIC -- delete this file once the question is answered.
#
# Round 1 established the cause of "nvme version 3.0-b.3 (git 3.0-b.3+)":
# actions/checkout runs Git for Windows, whose config on the runner has
# core.autocrlf=true, so the working tree is written with CRLF. MSYS2's git --
# the one meson calls for "git describe" -- has autocrlf unset, so it sees
# every text file as modified and describe reports the tree as dirty.
#
# Round 2 tests the fix: turn autocrlf off before checkout, so the working
# tree is byte-identical to the repository and both git binaries agree.
#
# sed -n '1,Np' instead of "head -N" throughout: setup-msys2's shell runs with
# -e and pipefail, so head closing the pipe early kills the step with 141.

name: Micron - dirty tree probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to check out'
        type: string
        default: 'v3.0-b.3'
      fix:
        description: 'Set core.autocrlf=false before checking out'
        type: boolean
        default: true

jobs:
  probe:
    name: probe ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win64
            runner: windows-latest
            msystem: UCRT64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    steps:
      - name: Where does autocrlf come from, and turn it off
        shell: bash
        run: |
          set -uo pipefail
          echo "== autocrlf before, with origins =="
          git config --show-origin --get-all core.autocrlf || echo '<unset>'
          if [ "${{ inputs.fix }}" = "true" ]; then
            git config --global core.autocrlf false
            echo "== autocrlf after =="
            git config --show-origin --get-all core.autocrlf || echo '<unset>'
          else
            echo "fix=false: leaving autocrlf alone"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Ask the runner's own git
        shell: bash
        run: |
          set -uo pipefail
          git --version
          echo "== config =="
          for k in core.autocrlf core.fileMode core.eol; do
            echo "$k = $(git config --get "$k" || echo '<unset>')"
          done
          echo "== describe =="
          git describe --abbrev=7 --dirty=+ || true
          echo "== modified tracked files =="
          git status --porcelain --untracked-files=no | sed -n '1,10p'
          git status --porcelain --untracked-files=no | wc -l

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git

      - name: Ask MSYS2's git, the way the release build does
        shell: msys2 {0}
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --version
          echo "== config =="
          for k in core.autocrlf core.fileMode core.eol; do
            echo "$k = $(git config --get "$k" || echo '<unset>')"
          done
          echo "== describe =="
          git describe --abbrev=7 --dirty=+ || true
          echo "== modified tracked files =="
          git status --porcelain --untracked-files=no | sed -n '1,10p'
          git status --porcelain --untracked-files=no | wc -l
          echo "== line endings on disk =="
          if head -c 400 CONTRIBUTING.md | grep -q $'\r'; then
            echo "CONTRIBUTING.md has CRLF"
          else
            echo "CONTRIBUTING.md has LF"
          fi
