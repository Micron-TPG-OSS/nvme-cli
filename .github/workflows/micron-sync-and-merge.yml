---
# SPDX-License-Identifier: GPL-2.0-or-later
#
# This file is part of nvme.
# Combined workflow to sync upstream master and merge into an integration branch

name: Micron - Sync and Merge

on:
  schedule:
    # Run daily at 12:00 UTC (5 AM MST / 6 AM MDT)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      run_sync:
        description: 'Run Sync'
        type: boolean
        default: true
      run_merge:
        description: 'Run Merge (only if enabled in the config job)'
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Self-contained settings for the merge job. Edit the two values below; no
  # repository variables or other out-of-file settings are required.
  #
  #   merge_enabled        'true' turns the auto-merge job on; any other value
  #                        keeps it off and the merge job is skipped entirely.
  #   merge_target_branch  Long-running integration branch that master is
  #                        merged into when the merge job is enabled.
  #
  # The merge job is OFF: the 'mingw' branch is retired (archived as the tag
  # archive/mingw).
  # To re-enable, set merge_enabled to 'true' and point merge_target_branch at
  # the integration branch.
  # ---------------------------------------------------------------------------
  config:
    runs-on: ubuntu-latest
    outputs:
      merge_enabled: ${{ steps.settings.outputs.merge_enabled }}
      merge_target_branch: ${{ steps.settings.outputs.merge_target_branch }}
    steps:
      - name: Define merge settings
        id: settings
        run: |
          set -euo pipefail
          merge_enabled=false
          merge_target_branch=

          # Guard: if the merge job is enabled, a target branch must be set,
          # otherwise checkout would silently fall back to the default branch
          # and the push would fail late with a confusing empty branch name.
          if [ "$merge_enabled" = "true" ] && [ -z "$merge_target_branch" ]; then
            echo "::error::merge_enabled is 'true' but merge_target_branch is empty; set the integration branch in the config job."
            exit 1
          fi

          {
            echo "merge_enabled=$merge_enabled"
            echo "merge_target_branch=$merge_target_branch"
          } >> "$GITHUB_OUTPUT"

  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_sync == true }}
    permissions:
      contents: write
    concurrency:
      group: sync-master-to-upstream
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Prepare workspace and configure Git
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work && cd work
          git init
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add remotes
        run: |
          set -euo pipefail
          cd work
          git remote add origin "https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git remote add upstream https://github.com/linux-nvme/nvme-cli.git
          git remote -v

      - name: Fetch and validate upstream master
        run: |
          set -euo pipefail
          cd work
          git fetch upstream master
          if ! git show-ref --verify --quiet "refs/remotes/upstream/master"; then
            echo "::error::Branch 'master' does not exist in upstream repository"
            exit 1
          fi

      - name: Merge upstream into origin branch
        run: |
          set -euo pipefail
          cd work
          # Fetch and checkout our fork's branch
          git fetch origin master
          git checkout -B master origin/master
          # Merge upstream master
          git merge upstream/master -m "Sync: merge upstream master into master" --no-edit

      - name: Push changes
        run: |
          set -euo pipefail
          cd work
          git push origin master

  merge:
    needs: [config, sync]
    runs-on: ubuntu-latest
    # always() required - without it, GitHub skips this job when sync is skipped, ignoring the rest of the condition
    if: |
      always() &&
      needs.sync.result != 'failure' &&
      needs.config.outputs.merge_enabled == 'true' &&
      (github.event_name == 'schedule' || inputs.run_merge == true)
    permissions:
      contents: write
    concurrency:
      group: merge-master-to-integration
      cancel-in-progress: false

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.config.outputs.merge_target_branch }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge master into ${{ needs.config.outputs.merge_target_branch }}
        run: |
          set -euo pipefail
          git fetch origin master
          git merge origin/master -m "Auto-merge master into ${{ needs.config.outputs.merge_target_branch }}"

      - name: Push changes
        run: |
          set -euo pipefail
          git push origin "${{ needs.config.outputs.merge_target_branch }}"

      - name: Notify on merge conflict
        if: failure()
        run: |
          set -euo pipefail
          echo "::error::Failed to merge master into ${{ needs.config.outputs.merge_target_branch }}. Manual intervention required."
          exit 1

  notify:
    needs: [config, sync, merge]
    runs-on: ubuntu-latest
    # always() required - without it, GitHub skips this job when sync or merge is skipped, ignoring the rest of the condition
    if: |
      always() &&
      (needs.config.result == 'failure' || needs.sync.result == 'failure' || needs.merge.result == 'failure')
    steps:
      - name: Determine failed job
        id: failed-job
        run: |
          if [ "${{ needs.config.result }}" == "failure" ]; then
            echo "job_name=Config" >> $GITHUB_OUTPUT
            echo "job_step=validate merge settings" >> $GITHUB_OUTPUT
          elif [ "${{ needs.sync.result }}" == "failure" ]; then
            echo "job_name=Sync" >> $GITHUB_OUTPUT
            echo "job_step=sync upstream master" >> $GITHUB_OUTPUT
          elif [ "${{ needs.merge.result }}" == "failure" ]; then
            echo "job_name=Merge" >> $GITHUB_OUTPUT
            echo "job_step=merge master into ${{ needs.config.outputs.merge_target_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Send Teams Notification
        run: |
          WORKFLOW_NAME="${{ github.workflow }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT:0:7}"
          REPO="${{ github.repository }}"
          TRIGGERED_BY="${{ github.actor }}"
          FAILED_JOB="${{ steps.failed-job.outputs.job_name }}"
          FAILED_STEP="${{ steps.failed-job.outputs.job_step }}"

          # Create Teams adaptive card payload
          cat > payload.json <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Workflow Failed: ${WORKFLOW_NAME} - ${FAILED_JOB}",
            "themeColor": "FF0000",
            "title": "❌ Workflow Failed: ${WORKFLOW_NAME}",
            "sections": [
              {
                "activityTitle": "Repository: ${REPO}",
                "facts": [
                  {
                    "name": "Failed Job:",
                    "value": "${FAILED_JOB} (${FAILED_STEP})"
                  },
                  {
                    "name": "Branch:",
                    "value": "${BRANCH}"
                  },
                  {
                    "name": "Commit:",
                    "value": "${COMMIT_SHORT}"
                  },
                  {
                    "name": "Triggered by:",
                    "value": "${TRIGGERED_BY}"
                  },
                  {
                    "name": "Status:",
                    "value": "Failed"
                  }
                ]
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "View Workflow Run",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${WORKFLOW_URL}"
                  }
                ]
              },
              {
                "@type": "OpenUri",
                "name": "View Commit",
                "targets": [
                  {
                    "os": "default",
                    "uri": "https://github.com/${REPO}/commit/${COMMIT}"
                  }
                ]
              }
            ]
          }
          EOF

          # Send notification to Teams webhook
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
